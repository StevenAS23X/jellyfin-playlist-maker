name: Publish to plugin repository

# Builds the plugin, packages it the way Jellyfin expects (via jprm), and
# publishes/updates manifest.json on the gh-pages branch. That manifest URL
# is what gets added in Jellyfin under Dashboard > Plugins > Repositories —
# after that, installs and updates happen from the normal plugin catalog,
# no manual .dll copying required.
#
# Triggered by pushing a tag like "v1.0.0.0" (matching build.yaml's version).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install jprm
        run: pip install jprm

      - name: Determine version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and package plugin
        id: package
        run: |
          mkdir -p artifacts
          zip_path=$(jprm plugin build src/Jellyfin.Plugin.PlaylistMaker \
            --output artifacts \
            --version "${{ steps.version.outputs.version }}" \
            --dotnet-configuration Release \
            --dotnet-framework net8.0)
          echo "zip_path=${zip_path}" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update repository manifest
        run: |
          jprm repo add gh-pages/manifest.json "${{ steps.package.outputs.zip_path }}" \
            --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Commit and push manifest
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish ${{ github.ref_name }} to plugin repository" || echo "Nothing to commit"
          git push

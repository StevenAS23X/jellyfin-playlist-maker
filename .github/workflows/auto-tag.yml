name: Auto-tag release

# Whenever build.yaml's version changes on this branch, tag that commit and push the tag - which
# in turn triggers publish-repo.yml, so a version bump is the only manual step in a release. No
# separate `git tag` / `git push` step needed on any machine.

on:
  push:
    branches:
      - claude/jellyfin-playlist-recommendations-mw7bkr
    paths:
      - 'src/Jellyfin.Plugin.PlaylistMaker/build.yaml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from build.yaml
        id: version
        run: |
          version=$(grep -m1 '^version:' src/Jellyfin.Plugin.PlaylistMaker/build.yaml | sed -E 's/version:\s*"([^"]+)"/\1/')
          if [ -z "$version" ]; then
            echo "::error::Could not parse version from build.yaml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Tag and push if new
        id: tag
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own GITHUB_TOKEN does not trigger other workflows'
      # `on: push` triggers (GitHub's anti-recursion guard) - so the tag above landed, but
      # publish-repo's `push: tags: v*` trigger never fired for it. Dispatch it explicitly
      # instead, targeting the new tag as the ref so it builds/packages that exact version.
      - name: Trigger publish-repo for the new tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-repo.yml --ref "${{ steps.tag.outputs.tag }}"
